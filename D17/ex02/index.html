<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Thanh toán</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: { sans: ["Be Vietnam Pro", "sans-serif"] },
                    },
                },
            };
        </script>
    </head>
    <body class="bg-slate-50 text-stone-800 p-4 md:p-6 font-sans min-h-screen">
        <div class="max-w-2xl mx-auto">
            <h1 class="text-2xl font-bold text-slate-900 mt-4 mb-6">
                Thông tin thanh toán
            </h1>
            <form
                id="checkout-form"
                class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm space-y-4"
            >
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1"
                        >Họ tên</label
                    >
                    <input
                        id="fullname"
                        type="text"
                        placeholder="Nguyễn Văn A"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1"
                        >Số điện thoại</label
                    >
                    <input
                        id="phone"
                        type="tel"
                        placeholder="0912345678"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1"
                        >Email</label
                    >
                    <input
                        id="email"
                        type="email"
                        placeholder="example@email.com"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1"
                        >Địa chỉ nhận hàng</label
                    >
                    <textarea
                        id="address"
                        placeholder="Số nhà, đường, quận, thành phố..."
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    ></textarea>
                </div>

                <div class="flex items-center gap-2 pt-2">
                    <input
                        id="remember"
                        type="checkbox"
                        class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500"
                    />
                    <label
                        for="remember"
                        class="text-sm text-slate-700 cursor-pointer"
                    >
                        Ghi nhớ thông tin cho lần sau
                    </label>
                </div>

                <div class="flex gap-3 pt-4 border-t border-slate-200">
                    <button
                        type="button"
                        id="clear-btn"
                        class="px-4 py-2 border border-red-300 text-red-600 rounded-lg hover:bg-red-50 text-sm font-medium transition"
                    >
                        Xóa thông tin đã lưu
                    </button>
                    <button
                        type="submit"
                        class="ml-auto px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition"
                    >
                        Đặt hàng
                    </button>
                </div>
            </form>
        </div>

        <script src="./js/main.js"></script>
    </body>
</html>
