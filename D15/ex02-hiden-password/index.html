<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ẩn/Hiện mật khẩu</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="flex items-center justify-center min-h-screen bg-slate-50">
        <form class="bg-white rounded-2xl shadow-lg p-8 w-80">
            <label for="password" class="block mb-2 font-medium text-slate-700">
                Mật khẩu
            </label>

            <div class="flex gap-2">
                <input
                    id="password"
                    type="password"
                    class="flex-1 border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500"
                />
                <button
                    id="toggle-btn"
                    type="button"
                    class="px-2 text-slate-500 hover:text-slate-700"
                >
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </form>

        <script src="./js/main.js"></script>
    </body>
</html>
