<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Random màu nền bằng mã HEX</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body
        id="body-bg"
        class="h-screen flex items-center justify-center transition-colors duration-500 bg-gray-300"
    >
        <div
            class="bg-white p-8 rounded-2xl shadow-lg text-center max-w-sm w-full"
        >
            <h1 class="text-2xl font-bold text-gray-800 mb-4">
                Background Color
            </h1>

            <p
                class="text-xl text-gray-600 mb-6 font-mono bg-gray-100 py-2 px-4 rounded-lg inline-block border border-gray-200"
            >
                Mã màu:
                <span id="color-code" class="font-bold text-black"
                    >.......</span
                >
            </p>

            <button
                id="btn-generate"
                class="w-full bg-black hover:bg-gray-800 text-white font-semibold py-3 px-6 rounded-lg transition-colors shadow-md"
            >
                Tạo màu ngẫu nhiên
            </button>
        </div>
        <script src="js/main.js"></script>
    </body>
</html>
